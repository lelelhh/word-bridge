<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>单词桥</title>
<meta name="theme-color" content="#2FC1BE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="单词桥">
<meta name="description" content="把作业单词练一遍，再一块板一块板地跳过河。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#12203A; --ink2:#1E3153; --ink3:#33496E;
  --sun:#F2784B; --gold:#F7C948; --leaf:#2E7D6B;
  --wood:#B08155; --woodD:#8C6544;
  --sky1:#24406B; --sky2:#7FA6C4;
  --cream:#F3EEE2; --paper:#FFFBF2; --line:#DED5C2;
  --muted:#6F7B8C;
  --ok:#2E7D6B; --bad:#C4483E;
}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:#0B1526;
  color:var(--ink);
  display:flex;justify-content:center;
  min-height:100vh;
}
.phone{
  width:100%;max-width:440px;min-height:100vh;
  background:var(--cream);
  position:relative;overflow-x:hidden;
  display:flex;flex-direction:column;
}
@media(min-width:700px){
  body{align-items:center;padding:24px 0}
  .phone{min-height:calc(100vh - 48px);border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.55);overflow:hidden}
}

/* ---------- 通用 ---------- */
#view{flex:1;display:flex;flex-direction:column;min-height:0}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.pad{padding:0 20px}
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:14px 14px 10px;flex:0 0 auto;
}
.topbar .back{
  width:40px;height:40px;border-radius:10px;border:none;background:transparent;
  display:grid;place-items:center;cursor:pointer;color:inherit;flex:0 0 auto;
}
.topbar .back:active{background:rgba(0,0,0,.08)}
.topbar h2{margin:0;font-size:17px;font-weight:700;letter-spacing:.3px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .right{margin-left:auto;flex:0 0 auto}
.pagetitle{font-size:26px;font-weight:800;letter-spacing:-.3px;margin:6px 0 2px}
.sub{font-size:13px;color:var(--muted);line-height:1.6}

.btn{
  border:none;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:transform .12s,filter .12s;
}
.btn:active{transform:scale(.97);filter:brightness(.94)}
.btn-main{background:var(--sun);color:#fff;box-shadow:0 4px 0 #C25A33}
.btn-main:active{box-shadow:0 2px 0 #C25A33}
.btn-green{background:var(--leaf);color:#fff;box-shadow:0 4px 0 #1F5B4E}
.btn-green:active{box-shadow:0 2px 0 #1F5B4E}
.btn-ghost{background:transparent;color:var(--ink3);border:1.5px solid var(--line)}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:9px;box-shadow:none!important}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important}

.field{
  width:100%;padding:13px 14px;border-radius:11px;border:1.5px solid var(--line);
  background:var(--paper);font-size:16px;font-family:inherit;color:var(--ink);outline:none;
}
.field:focus{border-color:var(--leaf)}
textarea.field{resize:vertical;min-height:120px;line-height:1.7;font-size:15px}
.label{font-size:13px;font-weight:700;color:var(--ink3);margin:14px 0 6px;display:block}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.divider{height:1.5px;background:var(--line);margin:14px 0}
.empty{text-align:center;padding:36px 10px;color:var(--muted);font-size:14px;line-height:1.8}

.tabs{display:flex;gap:6px;background:#E7E0D1;border-radius:11px;padding:4px;margin:0 20px 12px;flex:0 0 auto}
.tabs button{
  flex:1;border:none;background:transparent;padding:9px 4px;border-radius:8px;
  font-size:14px;font-weight:700;color:#7B7466;cursor:pointer;font-family:inherit;
}
.tabs button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;min-height:0}
.list{display:flex;flex-direction:column;gap:10px;padding:0 20px 24px}
.item{
  background:var(--paper);border:1.5px solid var(--line);border-radius:12px;
  padding:13px 14px;display:flex;align-items:center;gap:12px;
}
.item .t{font-size:15px;font-weight:700;line-height:1.35;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .d{font-size:12px;color:var(--muted);margin-top:3px}
.iconbtn{
  width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper);
  display:grid;place-items:center;cursor:pointer;flex:0 0 auto;color:var(--ink3);
}
.iconbtn:active{background:#EFE9DA}

/* ---------- 家长端 ---------- */
.home-hero{
  background:var(--cream);padding:34px 22px 0;text-align:center;
}
.logo{width:76px;height:76px;margin:0 auto 12px;display:block}
.brand{font-size:30px;font-weight:800;letter-spacing:2px;margin:0}
.brand-sub{font-size:12px;letter-spacing:4px;color:var(--muted);margin-top:8px}
.rolewrap{padding:26px 22px 30px;display:flex;flex-direction:column;gap:14px}
.role-kid{
  border:none;border-radius:18px;padding:26px 20px;cursor:pointer;text-align:left;
  background:linear-gradient(140deg,#2B4B7A,#12203A);color:#fff;
  position:relative;overflow:hidden;font-family:inherit;
}
.role-kid .h{font-size:23px;font-weight:800;letter-spacing:1px}
.role-kid .s{font-size:13px;color:#A9C0D8;margin-top:7px}
.role-kid:active{transform:scale(.985)}
.role-parent{
  border:1.5px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:14px;padding:16px 18px;cursor:pointer;text-align:left;font-family:inherit;
  display:flex;align-items:center;gap:12px;
}
.role-parent:active{background:#EFE9DA}

.dash{display:grid;grid-template-columns:1fr;gap:12px;padding:4px 20px 24px}
.dashcard{
  background:var(--paper);border:1.5px solid var(--line);border-radius:15px;
  padding:18px;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);
  display:flex;align-items:center;gap:14px;
}
.dashcard:active{background:#EFE9DA}
.dashcard .ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto}
.dashcard .tt{font-size:16px;font-weight:800}
.dashcard .dd{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}

.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 20px 18px}
.stat{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:13px 8px;text-align:center}
.stat .n{font-size:24px;font-weight:800;line-height:1.1}
.stat .k{font-size:11px;color:var(--muted);margin-top:5px}

.chip{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;background:#E7E0D1;color:#6A6252}
.chip.on{background:#DCEBE5;color:var(--leaf)}
.chip.warn{background:#F7DED2;color:#A9542F}

/* ---------- 孩子端 ---------- */
.kidbg{background:var(--ink);color:#fff}
.kidtop{padding:14px 16px 6px;display:flex;align-items:center;gap:12px}
.avatar{
  width:46px;height:46px;border-radius:50%;border:2px solid var(--gold);overflow:hidden;
  background:#243A5E;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;padding:0;
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar span{font-size:15px;font-weight:800;color:var(--gold)}
.kidhello{font-size:13px;color:#9FB4CC}
.kidname{font-size:15px;font-weight:700;margin-top:2px}

.todaycard{
  margin:14px 16px 6px;border-radius:16px;padding:18px;cursor:pointer;border:none;width:calc(100% - 32px);
  background:linear-gradient(135deg,#F2784B,#D9532F);color:#fff;text-align:left;font-family:inherit;
  position:relative;overflow:hidden;
}
.todaycard:active{transform:scale(.985)}
.todaycard .tag{font-size:11px;letter-spacing:2px;font-weight:800;opacity:.85}
.todaycard .nm{font-size:19px;font-weight:800;margin-top:8px}
.todaycard .mt{font-size:12px;opacity:.85;margin-top:6px}
.todaycard .go{position:absolute;right:16px;bottom:16px;font-size:12px;font-weight:800;
  background:rgba(255,255,255,.2);padding:7px 12px;border-radius:8px}

.ktabs{display:flex;gap:4px;margin:14px 16px 10px;flex:0 0 auto}
.ktabs button{
  border:none;background:transparent;color:#8095AE;padding:8px 12px;border-radius:8px;
  font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
}
.ktabs button.on{background:#22375A;color:#fff}
.kmodes{display:flex;gap:8px;margin:12px 16px 0;flex:0 0 auto}
.kmode{
  flex:1;padding:11px 0;border:1.5px solid #2C4266;background:#1A2C4A;border-radius:11px;
  color:#C9D8EA;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
}
.kmode:active{background:#22375A;color:#fff}
.kmode.on{background:#F7C948;border-color:#F7C948;color:#1B2740}
.pchips{display:flex;gap:7px;overflow-x:auto;padding:10px 16px 4px;flex:0 0 auto;scrollbar-width:none}
.pchips::-webkit-scrollbar{display:none}
.pchip{
  flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1.5px solid #2C4266;background:transparent;
  color:#9FB4CC;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;
}
.pchip.on{background:#F7C948;border-color:#F7C948;color:#1B2740}
.qopt{
  display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:9px;border-radius:12px;
  border:1.5px solid #2C4266;background:#16243D;color:#E8F0F8;font-size:16px;font-weight:700;
  font-family:inherit;cursor:pointer;
}
.qopt:active{background:#1E3350}
.qopt.ok{background:#1F5D4B;border-color:#3FBF92;color:#fff}
.qopt.bad{background:#5C2E2E;border-color:#E06B6B;color:#fff}
.qopt:disabled{cursor:default}

.bridge-card{
  border:none;width:100%;border-radius:14px;padding:15px;cursor:pointer;text-align:left;font-family:inherit;
  background:#1B2C4A;border:1.5px solid #2C4266;color:#fff;display:flex;align-items:center;gap:12px;
}
.bridge-card:active{background:#22375A}
.bridge-card .minibridge{width:52px;height:34px;flex:0 0 auto}
.bridge-card .nm{font-size:15px;font-weight:700}
.bridge-card .mt{font-size:11.5px;color:#8FA6C1;margin-top:4px}
.bridge-card.done{opacity:.62}
.bridge-card.weak{background:#2A2033;border-color:#5B4468}
.bridge-card .arw{flex:0 0 auto;color:#6E86A4}

.glow{position:absolute;width:76px;height:16px;margin-left:0;z-index:8;mix-blend-mode:screen;border-radius:50%;opacity:0;
  background:radial-gradient(ellipse at 50% 42%,rgba(255,222,150,1) 0%,rgba(255,196,102,.85) 30%,rgba(255,186,86,.35) 58%,rgba(255,186,86,0) 76%);
  transition:opacity .35s ease;pointer-events:none;z-index:3}
.glow.on{opacity:.58}
.glow.hot{opacity:1}
.rope{display:none !important}
.track,.board{display:none !important}

/* ---------- 场景 ---------- */
.scene{background-size:100% 100% !important;background-position:0 0 !important;
  position:relative;width:100%;height:330px;overflow:hidden;flex:0 0 auto;
  background:linear-gradient(180deg,#24406B 0%,#4B6E97 38%,#8FB0C9 62%,#C9D3C9 100%);
}
.scene svg.land{position:absolute;inset:0;width:100%;height:100%}
.sun{position:absolute;left:50%;top:16%;width:74px;height:74px;margin-left:-37px;border-radius:50%;
  background:radial-gradient(circle,#FFD08A,#F2784B 70%);opacity:.9;filter:blur(.3px)}
.water{display:none;position:absolute;left:0;right:0;bottom:0;height:42%;
  background:linear-gradient(180deg,#3C6484,#1B3350 85%)}
.waterline{display:none;position:absolute;left:0;right:0;bottom:42%;height:3px;background:rgba(255,255,255,.22)}
.track{position:absolute;left:0;bottom:0;height:100%;width:100%;transition:transform .55s cubic-bezier(.3,.9,.25,1);will-change:transform}
.board{
  position:absolute;width:64px;height:15px;border-radius:5px;
  background:linear-gradient(180deg,#C99B6E,#9A7150);
  box-shadow:0 3px 0 rgba(0,0,0,.35);
  transition:background .3s,box-shadow .3s,transform .3s;
}
.board.past{background:linear-gradient(180deg,#8FD3AE,#4FA487);box-shadow:0 0 12px rgba(120,220,160,.55)}
.board.shake{animation:bshake .4s ease}
@keyframes bshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px) rotate(-3deg)}75%{transform:translateX(4px) rotate(3deg)}}
.board.gap{opacity:.18}
.pile{position:absolute;width:9px;height:72px;bottom:-72px;background:#7A5B3F;border-radius:2px}

.waterfx{position:absolute;left:0;right:0;bottom:80px;height:70px;opacity:0;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.55),rgba(255,255,255,0) 65%)}
.waterfx.on{animation:splash .7s ease-out}
@keyframes splash{0%{opacity:0;transform:scale(.4)}30%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}

/* 人物 rig —— 完整身体、腿脚，占场景高度约四成 */
.rig{
  position:absolute;width:116px;height:168px;left:0;bottom:0;
  transform-origin:50% 100%;will-change:transform;
  transition:left .5s cubic-bezier(.3,.9,.25,1),bottom .45s ease;
  filter:drop-shadow(0 6px 6px rgba(0,0,0,.35));
}
.rig svg{width:100%;height:100%;display:block;overflow:visible}
.rig .legs{transform-origin:50% 0}
.rig.walking .legA{animation:legs1 .32s linear infinite}
.rig.walking .legB{animation:legs2 .32s linear infinite}
@keyframes legs1{0%,100%{transform:rotate(19deg)}50%{transform:rotate(-14deg)}}
@keyframes legs2{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(19deg)}}
.rig .armL,.rig .armR{transform-origin:50% 0}
.rig.walking .armL{animation:arm1 .32s linear infinite}
.rig.walking .armR{animation:arm2 .32s linear infinite}
@keyframes arm1{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(20deg)}}
@keyframes arm2{0%,100%{transform:rotate(20deg)}50%{transform:rotate(-22deg)}}
.rig.jump{animation:jump .62s cubic-bezier(.34,1.3,.5,1) both}
@keyframes jump{
  0%{transform:translateY(0) rotate(0)}
  22%{transform:translateY(4px) scaleY(.9) scaleX(1.06)}
  50%{transform:translateY(-44px) rotate(-4deg) scaleY(1.04)}
  78%{transform:translateY(2px) scaleY(.94) scaleX(1.05)}
  100%{transform:translateY(0) rotate(0)}
}
.rig.fall{animation:fall .85s cubic-bezier(.5,.05,.9,.5) forwards}
@keyframes fall{
  0%{transform:translateY(0) rotate(0)}
  100%{transform:translateY(96px) rotate(24deg);opacity:.35}
}
.rig.idle{animation:idlebob 2.6s ease-in-out infinite}
@keyframes idlebob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
/* 上岸：先跃起再抬高到岸面，落地有一下压身 */
.rig.climb{animation:climb .95s cubic-bezier(.34,1.2,.5,1) both}
@keyframes climb{
  0%{transform:translateY(0) rotate(-3deg)}
  32%{transform:translateY(-56px) rotate(5deg) scaleY(1.05)}
  58%{transform:translateY(-18px) rotate(-3deg)}
  82%{transform:translateY(4px) scaleY(.9) scaleX(1.06)}
  100%{transform:translateY(0) rotate(0) scaleY(1)}
}
/* 上岸后站稳欢呼：双臂上举 + 轻微弹跳 */
.rig .armL,.rig .armR{transform-box:fill-box;transform-origin:50% 4%;transition:transform .28s ease}
.rig.cheer .armL{transform:rotate(165deg)}
.rig.cheer .armR{transform:rotate(-165deg)}
.rig.cheer{animation:cheerbob .8s ease-in-out infinite}
@keyframes cheerbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ---------- 两岸 ---------- */
.bank{position:absolute;bottom:0;border-radius:12px 12px 0 0;overflow:hidden}
.bank.left{background:
  repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 2px, transparent 2px 24px),
  linear-gradient(180deg,#9A7850,#7A5B3C 46%,#4E3B26 100%)}
.bank.right{background:
  radial-gradient(120px 70px at 28% 10%, rgba(255,255,255,.12), transparent 70%),
  linear-gradient(180deg,#6E9A62,#3F6B44 55%,#2E5033 100%)}
.bank .top{position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(180deg,#D8BC90,#B99562)}
.bank .grass{position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(180deg,#B8E0A8,#8FC47F)}
.bank .flag{position:absolute;left:18px;bottom:100%;width:2px;height:34px;background:#E7EDF6;border-radius:1px}
.bank .flag i{position:absolute;left:2px;top:0;width:26px;height:17px;background:#F2784B;
  clip-path:polygon(0 0,100% 0,78% 50%,100% 100%,0 100%);border-radius:2px;
  transform-origin:0 50%;animation:flagwave 2.4s ease-in-out infinite}
@keyframes flagwave{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(-6deg) scaleX(.94)}}
.bank .sign{position:absolute;left:16px;bottom:14px;font-size:11px;letter-spacing:2px;color:#FFF3DA;
  text-shadow:0 1px 2px rgba(0,0,0,.45);font-weight:700}
.bank:after{content:'';position:absolute;left:-8px;right:-8px;bottom:-8px;height:16px;
  border-radius:50%;background:rgba(3,18,32,.38);filter:blur(6px)}

/* 上岸彩带 */
.spark{position:absolute;width:7px;height:7px;border-radius:2px;pointer-events:none;opacity:0;
  animation:sparkfly 1.15s ease-out forwards}
@keyframes sparkfly{
  0%{opacity:1;transform:translate(0,0) rotate(0) scale(.7)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1)}
}
/* 场景内浮出的欢呼字 */
.shout{position:absolute;left:0;right:0;top:2%;text-align:center;pointer-events:none;z-index:9;
  font-size:15px;font-weight:800;color:#FFF3DA;
  opacity:0;transform:translateY(10px) scale(.9)}
.shout span{display:inline-block;padding:5px 14px;border-radius:999px;white-space:nowrap;
  background:rgba(10,24,42,.82);border:1px solid rgba(247,201,72,.7);
  box-shadow:0 8px 22px rgba(0,0,0,.45)}
.shout.on{animation:shoutpop 1.5s ease-out forwards}
@keyframes shoutpop{
  0%{opacity:0;transform:translateY(14px) scale(.85)}
  18%{opacity:1;transform:translateY(0) scale(1.04)}
  30%{transform:translateY(0) scale(1)}
  80%{opacity:1}
  100%{opacity:0;transform:translateY(-10px) scale(1)}
}

/* ---------- 题目区 ---------- */
.qcard{
  margin:0 16px;padding:16px 16px 0;flex:1;display:flex;flex-direction:column;min-height:0;
}
.qline{display:flex;align-items:flex-start;gap:8px}
.qcn{font-size:30px;font-weight:800;color:#fff;line-height:1.25;letter-spacing:.5px;flex:1;min-width:0}
.qph{font-size:15px;color:#9FB4CC;margin-top:8px;letter-spacing:.2px;font-family:Georgia,serif}
.qmeta{font-size:11px;color:#6E86A4;margin-top:14px;letter-spacing:1px}
.speaker{
  width:40px;height:40px;border-radius:50%;border:1.5px solid #3A5170;background:#1B2C4A;
  color:#9FB4CC;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;margin-top:2px;
}
.speaker:active{background:#26405F;color:#fff}
.speaker.playing{animation:ring .6s ease}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(247,201,72,.6)}100%{box-shadow:0 0 0 14px rgba(247,201,72,0)}}

.answerbar{
  padding:12px 16px calc(16px + env(safe-area-inset-bottom));
  background:var(--ink);display:flex;gap:10px;flex:0 0 auto;
}
.answerbar input{
  flex:1;min-width:0;border-radius:11px;border:1.5px solid #34496B;background:#0E1B30;
  color:#fff;padding:13px 14px;font-size:18px;outline:none;font-family:inherit;letter-spacing:.5px;
}
.answerbar input::placeholder{color:#5F7590;font-size:14px;letter-spacing:0}
.answerbar input:focus{border-color:var(--gold)}
.answerbar button{
  border:none;border-radius:11px;padding:0 18px;font-size:15px;font-weight:800;cursor:pointer;
  background:var(--gold);color:#3A2A00;font-family:inherit;flex:0 0 auto;
}
.answerbar button:active{filter:brightness(.92)}

/* 预热页 */
.warmscene{
  height:170px;position:relative;overflow:hidden;flex:0 0 auto;
  background:linear-gradient(180deg,#203960,#46709B 70%,#5A86AC);
  display:flex;align-items:flex-end;justify-content:center;
}
.warmscene .rig{position:relative;left:auto;bottom:0}
.wordbig{
  font-size:34px;font-weight:800;color:#fff;text-align:center;line-height:1.25;
  letter-spacing:.5px;word-break:break-word;
}
.wordcn{font-size:17px;color:#CFDCE9;text-align:center;margin-top:6px}
.wordph{font-size:14px;color:#8FA6C1;text-align:center;margin-top:8px;font-family:Georgia,serif}
.pips{display:flex;gap:8px;justify-content:center;margin:14px 0 6px}
.pip{width:34px;height:5px;border-radius:3px;background:#2C4266;transition:background .3s}
.pip.on{background:var(--gold)}
.typing{
  margin:10px 16px 0;padding:14px;border-radius:12px;background:#0E1B30;border:1.5px solid #34496B;
  font-size:22px;color:#fff;letter-spacing:1px;min-height:56px;word-break:break-word;
}
.typing .ok{color:#8FD3AE}
.typing .no{color:#FF9A8A}
.typing .caret{display:inline-block;width:2px;height:20px;background:var(--gold);vertical-align:-3px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.keyhint{margin:8px 16px 0;font-size:12px;color:#6E86A4;text-align:center}

/* ---------- 结果 ---------- */
.resultwrap{padding:30px 22px;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center}
.result-ico{width:96px;height:96px;margin:0 auto 18px}
.result-h{font-size:30px;font-weight:800;color:#fff;letter-spacing:1px}
.result-s{font-size:13px;color:#8FA6C1;margin-top:8px}
.resultgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:26px 0 24px}
.resultgrid .b{background:#1B2C4A;border-radius:12px;padding:14px 6px;border:1.5px solid #2C4266}
.resultgrid .n{font-size:22px;font-weight:800;color:#fff}
.resultgrid .k{font-size:11px;color:#8FA6C1;margin-top:4px}

/* ---------- 听写 / 选择测试：一轮做完的收尾 ---------- */
.donewrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  overflow-y:auto;overflow-x:hidden;padding:26px 22px 30px;text-align:center;position:relative}
.donebadge{position:relative;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 32%,#2A6B5A,#16453A);
  border:2px solid rgba(143,211,174,.55);box-shadow:0 12px 30px rgba(0,0,0,.38);
  animation:badgepop .62s cubic-bezier(.2,.9,.3,1.45) both}
@keyframes badgepop{0%{transform:scale(.35);opacity:0}62%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
.donebadge:before,.donebadge:after{content:'';position:absolute;inset:-2px;border-radius:50%;
  border:2px solid rgba(143,211,174,.6);animation:donering 2.2s ease-out 1.1s infinite;pointer-events:none}
.donebadge:after{animation-delay:2.2s}
@keyframes donering{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.9);opacity:0}}
.donestars{display:flex;gap:8px;justify-content:center;margin-top:16px}
.donestars i{width:26px;height:26px;display:block;opacity:0;transform:scale(.4);
  clip-path:polygon(50% 0,63% 34%,99% 35%,71% 57%,81% 93%,50% 71%,19% 93%,29% 57%,1% 35%,37% 34%);
  animation:starpop .5s cubic-bezier(.2,.9,.3,1.5) both}
.donestars i.on{background:linear-gradient(180deg,#FFE9A8,#F7C948)}
.donestars i.off{background:#31466B}
@keyframes starpop{0%{opacity:0;transform:scale(.3) rotate(-25deg)}70%{opacity:1;transform:scale(1.15) rotate(4deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.donepraise{font-size:30px;font-weight:900;letter-spacing:1.5px;margin-top:14px;
  background:linear-gradient(180deg,#FFF6D8,#F7C948 60%,#E2A93A);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:praisepop .7s cubic-bezier(.2,.9,.3,1.4) .35s both}
@keyframes praisepop{0%{opacity:0;transform:translateY(12px) scale(.9)}100%{opacity:1;transform:none}}
.donepraiseCN{font-size:12px;color:#8FA6C1;margin-top:6px;animation:praisepop .6s ease-out .55s both}
.doneh{font-size:22px;font-weight:800;color:#fff;margin-top:14px;letter-spacing:.5px;animation:praisepop .6s ease-out .2s both}
.donesub{font-size:13px;color:#8FA6C1;margin-top:9px;line-height:1.75}
.donegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin:20px 0 20px}
.donegrid .b{background:#1B2C4A;border-radius:12px;padding:14px 6px;border:1.5px solid #2C4266}
.donegrid .n{font-size:22px;font-weight:800;color:#fff}
.donegrid .k{font-size:11px;color:#8FA6C1;margin-top:4px}
.doneconfetti{position:absolute;top:-14px;width:8px;height:8px;border-radius:2px;pointer-events:none;
  animation:conffall 2.4s linear forwards;z-index:1}
@keyframes conffall{
  0%{opacity:1;transform:translateY(0) rotate(0)}
  85%{opacity:1}
  100%{opacity:0;transform:translateY(78vh) rotate(420deg)}
}

/* ---------- 选择学生 ---------- */
.kclist{padding:14px 16px 26px;display:flex;flex-direction:column;gap:12px}
.kidcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
  background:#16253F;border:1.5px solid #2C4266;border-radius:16px;padding:16px 14px;font-family:inherit}
.kidcard.on{border-color:#F7C948;background:#1B2E4E;box-shadow:0 8px 22px rgba(0,0,0,.3)}
.kc-ava{width:64px;height:64px;flex:0 0 auto;border-radius:50%;overflow:hidden;display:grid;place-items:center;
  background:#22375A;border:2px solid #3A5170;color:#F7C948;font-size:24px;font-weight:800}
.kc-ava img{width:100%;height:100%;object-fit:cover;display:block}
.kidcard.on .kc-ava{border-color:#F7C948}
.kc-main{flex:1;min-width:0}
.kc-grade{font-size:18px;font-weight:800;color:#fff}
.kc-name{font-size:12px;color:#8FA6C1;margin-top:3px}
.kc-meta{font-size:12px;color:#6E86A4;margin-top:7px}
.kc-arrow{font-size:12px;color:#F7C948;font-weight:700;white-space:nowrap}

/* ---------- 弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(6,12,24,.72);display:grid;place-items:center;z-index:100;padding:20px}
.modal{background:var(--paper);border-radius:16px;padding:20px;width:100%;max-width:360px;max-height:84vh;overflow:auto}
.modal h3{margin:0 0 6px;font-size:17px;font-weight:800}
.modal p{margin:0 0 16px;font-size:13px;color:var(--muted);line-height:1.6}
.modal .acts{display:flex;gap:10px}
.modal .acts .btn{flex:1;padding:12px;font-size:14px}

.toast{
  position:fixed;left:50%;bottom:80px;transform:translate(-50%,10px);
  background:rgba(10,18,32,.94);color:#fff;padding:11px 18px;border-radius:10px;
  font-size:13px;z-index:200;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:80vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

.wordrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.wordrow input.en{flex:1.1;min-width:0;padding:10px;border-radius:9px;border:1.5px solid var(--line);font-size:15px;font-family:inherit;background:var(--paper)}
.wordrow input.cn{flex:1;min-width:0;padding:10px;border-radius:9px;border:1.5px solid var(--line);font-size:15px;font-family:inherit;background:var(--paper)}
.wordrow input.ph{flex:.95;min-width:0;padding:10px;border-radius:9px;border:1.5px solid var(--line);font-size:13px;font-family:inherit;background:#FBF6EA;color:#7B7466}

.selectlist{max-height:46vh;overflow-y:auto;border:1.5px solid var(--line);border-radius:11px;background:var(--paper)}
.selectrow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid #EDE6D8;cursor:pointer}
.selectrow:last-child{border-bottom:none}
.selectrow.on{background:#EAF2EF}
.selectrow .box{width:20px;height:20px;border-radius:5px;border:1.5px solid #C9BFAA;flex:0 0 auto;display:grid;place-items:center;background:#fff}
.selectrow.on .box{background:var(--leaf);border-color:var(--leaf);color:#fff}
.selectrow .en{font-size:14px;font-weight:700}
.selectrow .cn{font-size:12px;color:var(--muted);margin-top:2px}

.weakrow{display:flex;align-items:center;gap:10px}
.weakrow .en{font-size:15px;font-weight:800}
.weakrow .cn{font-size:12px;color:var(--muted);margin-top:2px}
</style>

.sun,.water,.waterline{display:none!important}

.board{
  width:68px;height:17px;border-radius:4px;
  background:
    repeating-linear-gradient(90deg,rgba(122,70,28,.16) 0 1.5px,transparent 1.5px 15px),
    linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 45%),
    linear-gradient(180deg,#EFC08A 0%,#D8A164 48%,#B2763A 100%);
  box-shadow:0 5px 0 rgba(139,90,43,.55),0 12px 18px rgba(8,52,44,.30),inset 0 2px 0 rgba(255,255,255,.55);
  border:1.5px solid rgba(140,86,38,.45);
}
.board:before,.board:after{
  content:'';position:absolute;top:4px;width:3px;height:3px;border-radius:50%;
  background:rgba(255,255,255,.55);box-shadow:inset 0 1px 1px rgba(0,0,0,.45);
}
.board:before{left:6px}
.board:after{right:6px}
.board.past{
  background:
    linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 45%),
    linear-gradient(180deg,#8DE6AE 0%,#4FCB88 60%,#2F9F66 100%);
  border-color:rgba(31,140,90,.35);
  box-shadow:0 4px 0 rgba(24,120,76,.4),0 0 16px rgba(96,230,150,.75);
}
.board.gap{opacity:.16}
.board.gone{opacity:0;transition:opacity .35s ease}
.board{transition:opacity .35s ease}
.board.shake{animation:bshake .4s ease}

.bank.right:after{display:none}
/* ===== 掉水演出：跌水 → 露头呼救 → 垂绳 → 攀爬 → 翻上木板 ===== */
.rig svg{transition:clip-path .18s linear}
.rig.dfall{animation:dfall .32s cubic-bezier(.5,.05,.9,.5) forwards}
@keyframes dfall{from{transform:translateY(0)}to{transform:translateY(106px)}}
.rig.dfall svg{animation:dcut .32s linear forwards}
@keyframes dcut{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 0 54% 0)}}
.rig.dwater{animation:swimbob 1.05s ease-in-out infinite}
.rig.dwater svg{clip-path:inset(0 0 54% 0)}
@keyframes swimbob{0%,100%{transform:translateY(106px)}50%{transform:translateY(99px)}}
.rig.dwater .armL{animation:paddleL .62s ease-in-out infinite}
.rig.dwater .armR{animation:paddleR .62s ease-in-out infinite}
@keyframes paddleL{0%,100%{transform:rotate(-52deg)}50%{transform:rotate(-8deg)}}
@keyframes paddleR{0%,100%{transform:rotate(52deg)}50%{transform:rotate(8deg)}}

.rig.dclimb{animation:dclimb 1.05s cubic-bezier(.4,.05,.2,1) forwards}
@keyframes dclimb{
  0%{transform:translateY(106px)}
  35%{transform:translateY(54px)}
  70%{transform:translateY(18px)}
  100%{transform:translateY(0)}
}
.rig.dclimb svg{animation:uncut .55s linear .25s forwards}
@keyframes uncut{from{clip-path:inset(0 0 54% 0)}to{clip-path:inset(0 0 0 0)}}
.rig.dclimb .armL{animation:grabL .5s ease-in-out infinite}
.rig.dclimb .armR{animation:grabR .5s ease-in-out infinite}
@keyframes grabL{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(-70deg)}}
@keyframes grabR{0%,100%{transform:rotate(22deg)}50%{transform:rotate(70deg)}}

.rig.dshake{animation:dshake .5s ease-out}
@keyframes dshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}50%{transform:rotate(4deg)}75%{transform:rotate(-2deg)}}

.rope{position:absolute;width:6px;height:0;top:calc(100% - 108px);left:0;opacity:0;z-index:6;
  background:linear-gradient(90deg,#C9A063,#8A6534 45%,#E3C68C);border-radius:3px;
  transform-origin:top center;box-shadow:0 1px 2px rgba(0,0,0,.22)}
.rope:after{content:'';position:absolute;left:-4px;bottom:-6px;width:14px;height:14px;border-radius:50%;
  border:2px solid #B08A4E;background:rgba(255,255,255,.3)}
.rope.on{opacity:1;animation:ropedrop .46s cubic-bezier(.3,.8,.3,1) forwards}

/* ================= 词库归类：年级 / 平日作业 ================= */
const GRADES = [
  { k: '3', name: '三年级' },
  { k: '4', name: '四年级' },
  { k: '7', name: '七年级' },
  { k: '8', name: '八年级' }
];
function gradeName(k) {
  const g = GRADES.find(x => x.k === String(k));
  return g ? g.name : '';
}
function guessGrade(l) {
  if (l.g) return String(l.g);
  const t = String((l.book || '') + ' ' + (l.name || ''));
  if (/八/.test(t)) return '8';
  if (/七/.test(t)) return '7';
  if (/四/.test(t)) return '4';
  if (/三/.test(t)) return '3';
  return '';
}
function isHomework(l) { return (l.k || (l.unit ? 'unit' : 'home')) === 'home'; }
/* 老数据补字段：按名字/册别猜年级，没有 unit 的算平日作业 */
function normalizeLibs() {
  let changed = false;
  (S.libs || []).forEach(l => {
    const g = guessGrade(l);
    if (!l.g && g) { l.g = g; changed = true; }
    const k = l.unit ? 'unit' : (l.k || 'home');
    if (!l.k) { l.k = k; changed = true; }
  });
  if (changed) save();
}
/* 分组：[年级 → 单元] + 平日作业 + 未归类 */
function libGroups(libs) {
  const arr = libs || [];
  const out = [];
  GRADES.forEach(g => {
    const items = arr.filter(l => !isHomework(l) && String(l.g || guessGrade(l)) === g.k);
    if (items.length) out.push({ key: 'g' + g.k, title: g.name, sub: items.length + ' 个单元', libs: items });
  });
  const home = arr.filter(l => isHomework(l));
  if (home.length) out.push({ key: 'home', title: '平日作业', sub: home.length + ' 个词库', libs: home });
  const none = arr.filter(l => !isHomework(l) && !GRADES.some(g => String(l.g || guessGrade(l)) === g.k));
  if (none.length) out.push({ key: 'none', title: '未归类', sub: none.length + ' 个单元', libs: none });
  return out;
}
/* 归类修改：val = '3'|'4'|'7'|'8'|''（年级，归为单元） 或 'home'（平日作业） */
function setLibGroup(lib, val) {

  if (val === 'home') { lib.g = ''; lib.k = 'home'; }

}

const STUDENT_DEFS = [

function newStudent(def) {

function ensureStudents() {

function save() {
  if (memOnly) return;
  try {
    stashStudent();
    const json = JSON.stringify({
      libs: S.libs, students: S.students, activeId: S.activeId,
      allowSkipWarm: S.allowSkipWarm, seedVer: S.seedVer
    });
    /* 写之前留一份上一版存档，误覆盖时还能捞回来 */
    const prev = localStorage.getItem(LSKEY);
    if (prev && prev !== json) localStorage.setItem(LSKEY + '_bak', prev);
    localStorage.setItem(LSKEY, json);
  } catch (e) {
    memOnly = true;
    toast('本地存储空间不足，本次数据只保存在当前页面');

function load() {
  let raw = null;
  try { raw = localStorage.getItem(LSKEY); } catch (e) { memOnly = true; }
  if (!raw) return false;
  let o = null;
  try { o = JSON.parse(raw); } catch (e1) {
    /* 主存档解析不了就退回上一份备份，并把它扶正 */
    try {
      const bak = localStorage.getItem(LSKEY + '_bak');
      if (bak) { o = JSON.parse(bak); localStorage.setItem(LSKEY, bak); }
    } catch (e2) { o = null; }
  }
  if (!o) return false;
  try {
    S.libs = o.libs || [];
    S.allowSkipWarm = o.allowSkipWarm !== false;
    S.seedVer = o.seedVer || '';
    if (Array.isArray(o.students) && o.students.length) {
      S.students = o.students;

      g7.bridges = o.bridges || [];
      g7.weak = o.weak || [];
      g7.sessions = o.sessions || [];
      g7.settings = Object.assign(g7.settings, o.settings || {});
      g7.auto = o.auto || {};

      loadStudent('g7');

    }

    return S.libs.length > 0;
  } catch (e) {

/* ================= 语音 =================
   两级发音：
   1) 系统语音（speechSynthesis）：只有系统里真的装了英文音色时才用。
      注意 Chrome 在 Windows 上走的是新版系统语音（OneCore），如果只装了中文音色，
      读英文会静默失败（error: language-unavailable / synthesis-failed）。
   2) 在线发音（有道词典发音接口）：没英文系统音色、或系统语音出错时自动兜底，
      用 Audio 播放 mp3，可直接控制倍速，不依赖系统音色。
   ======================================= */
const SPK = {
  mode: '',        // '' 未定 | 'system' | 'online'
  voices: [],
  el: null,        // 复用的 Audio 对象
  seq: 0,          // 递增序号，防止上一句覆盖新的一句
  token: 0,        // 单次播放尝试的序号，避免旧请求的回调干扰新请求
  pending: null,   // 因缺少用户手势被浏览器拦下的一句
  warned: false,
};

function refreshVoices() {
  try {
    const vs = (window.speechSynthesis && window.speechSynthesis.getVoices()) || [];
    if (vs.length) SPK.voices = vs.slice();
  } catch (e) { /* 保持原样 */ }
  return SPK.voices;
}
function enVoices() {
  if (!SPK.voices.length) refreshVoices();
  return SPK.voices.filter(v => /^en([-_]|$)/i.test(String(v.lang || '')));
}
function pickVoice(accent) {
  const list = enVoices();
  if (!list.length) return null;
  const want = String(accent || 'en-GB').toLowerCase();
  return list.find(v => String(v.lang || '').toLowerCase() === want)
    || list.find(v => String(v.lang || '').toLowerCase().replace('_', '-').slice(0, 2) === 'en'
                  && String(v.lang || '').toLowerCase().slice(3, 5) === want.slice(3, 5))
    || list[0];
}
function audioURL(text, accent) {
  const type = String(accent || '').toLowerCase() === 'en-us' ? 2 : 1; // 1 英式 / 2 美式
  return 'https://dict.youdao.com/dictvoice?type=' + type + '&audio=' + encodeURIComponent(text);
}
/* 备用接口：个别词条在 dictvoice 上取不到（返回 500），换这个接口再试 */
function audioURLAlt(text) {
  return 'https://dict.youdao.com/speech?audio=' + encodeURIComponent(text);
}
function tellOnce(msg) {
  if (SPK.warned) return;
  SPK.warned = true;
  try { toast(msg); } catch (e) {}
}

/* 一次播放尝试：真的开始出声才算成功 */
function tryAudio(url, rate, text, timeoutMs) {
  return new Promise(resolve => {
    if (!SPK.el) {
      SPK.el = new Audio();
      SPK.el.preload = 'auto';
    }
    const a = SPK.el;
    const token = ++SPK.token;
    let done = false;
    const onErr = () => { if (token === SPK.token) finish(false); };
    const onPlay = () => { if (token === SPK.token) finish(true); };
    const wd = setTimeout(() => { if (token === SPK.token) finish(false); }, timeoutMs || 4000);
    function finish(ok) {
      if (done) return;
      done = true;
      clearTimeout(wd);
      if (a.onerror === onErr) a.onerror = null;
      if (a.onplaying === onPlay) a.onplaying = null;
      if (ok) { SPK.warned = false; }
      resolve(ok);
    }
    a.onerror = onErr;
    a.onplaying = onPlay;
    try { a.pause(); } catch (e) {}
    a.src = url;
    a.playbackRate = Math.max(0.5, Math.min(2, Number(rate) || 0.85));
    let p = null;
    try { p = a.play(); } catch (e) { p = null; }
    if (p && p.catch) p.catch(err => {
      // 浏览器自动播放策略拦截：留到用户下一次点击再补播
      if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')) {
        SPK.pending = { text, rate };
        tellOnce('点一下屏幕就能听到发音');
        finish(false);
      }
    });
  });
}

function playOnline(text, rate) {
  SPK.mode = 'online';
  const acc = String((S.settings && S.settings.accent) || 'en-GB').toLowerCase();
  const urls = (acc === 'en-us'
    ? [audioURL(text, 'en-US'), audioURL(text, 'en-GB')]
    : [audioURL(text, 'en-GB'), audioURL(text, 'en-US')]).concat([audioURLAlt(text)]);
  const mySeq = SPK.seq;
  let i = 0;
  const next = () => {
    if (SPK.seq !== mySeq) return Promise.resolve(true); // 已被新的一句取代
    if (i >= urls.length) return Promise.resolve(false);
    return tryAudio(urls[i++], rate, text).then(ok => ok ? true : next());
  };
  return next().then(ok => {
    if (!ok && SPK.seq === mySeq) tellOnce('这一句的发音暂时取不到，检查一下网络再试');
    return ok;
  });
}

function speakSys(text, rate) {
  return new Promise(resolve => {
    let started = false, settled = false, wd = null;
    const finish = ok => {
      if (settled) return;
      settled = true;
      clearTimeout(wd);
      resolve(ok);
    };
    let u;
    try {
      u = new SpeechSynthesisUtterance(text);
      const accent = (S.settings && S.settings.accent) || 'en-GB';
      const v = pickVoice(accent);
      if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = accent; }
      u.rate = Math.max(0.5, Math.min(2, Number(rate) || 0.85));
      u.onstart = () => { started = true; finish(true); };
      u.onerror = () => finish(false);
      u.onend = () => finish(started);
      wd = setTimeout(() => { if (!started) { try { speechSynthesis.cancel(); } catch (e) {} finish(false); } }, 900);
      window.speechSynthesis.speak(u);
    } catch (e) { finish(false); }
  });
}

function speak(text, rate) {
  if (!text) return;
  const r = Number(rate || (S.settings && S.settings.rate) || 0.85);
  const seq = ++SPK.seq;
  try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
  if (SPK.el) { try { SPK.el.pause(); } catch (e) {} }

  // 首次调用时决定用哪一级：系统里有英文音色就先试系统语音，否则直接在线发音
  if (!SPK.mode) SPK.mode = (typeof window.speechSynthesis !== 'undefined' && enVoices().length) ? 'system' : 'online';

  if (SPK.mode === 'system') {
    speakSys(text, r).then(ok => {
      if (seq !== SPK.seq || ok) return;   // 成功了，或被新的一句取代
      SPK.mode = 'online';                 // 系统语音不可用，之后都用在线发音
      playOnline(text, r);
    });
    return;
  }
  playOnline(text, r);
}

function audioOK() {
  return typeof window.speechSynthesis !== 'undefined' || typeof window.Audio !== 'undefined';
}
function speechEngineLabel() {
  if (SPK.mode === 'system') {
    const v = pickVoice((S.settings && S.settings.accent) || 'en-GB');
    return '系统语音' + (v ? '（' + v.name + '）' : '');
  }
  if (SPK.mode === 'online') return '在线发音（有道）';
  return enVoices().length ? '系统语音' : '在线发音（有道）';
}
// 被自动播放策略拦下后，用用户下一次点击补播；顺便解锁音效
document.addEventListener('pointerdown', function () {
  audioCtx();
  if (SPK.pending) { const p = SPK.pending; SPK.pending = null; playOnline(p.text, p.rate); }
}, true);

/* ================= 音效 =================
   用 WebAudio 现场合成：不吃网络、不会被拦、零延迟。
   浏览器要求音频上下文在用户手势里创建/恢复，进游戏本来就是点击进来的。
   ======================================= */
const SFX = { ctx: null };
function audioCtx() {
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    if (!SFX.ctx) SFX.ctx = new C();
    if (SFX.ctx.state === 'suspended') SFX.ctx.resume();
    return SFX.ctx;
  } catch (e) { return null; }
}
function sfxTone(ctx, freq, at, dur, gain, type, slideTo) {
  try {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, at);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, at + dur);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(gain, at + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start(at);
    osc.stop(at + dur + 0.03);
  } catch (e) {}
}
function sfxNoise(ctx, at, dur, gain, cutoff) {
  try {
    const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = cutoff || 900;
    const g = ctx.createGain();
    g.gain.value = gain;
    src.connect(lp);
    lp.connect(g);
    g.connect(ctx.destination);
    src.start(at);
  } catch (e) {}
}
/* 掉河里：下滑"咚——" + 落水"噗" */
function sfxMiss(big) {
  const ctx = audioCtx();
  if (!ctx) return;
  const t = ctx.currentTime;
  sfxTone(ctx, 430, t, 0.30, 0.26, 'triangle', 110);
  sfxNoise(ctx, t + 0.24, big ? 0.42 : 0.22, big ? 0.42 : 0.22, 900);
  if (big) sfxTone(ctx, 180, t + 0.20, 0.22, 0.16, 'sine', 90);
}
/* 成功上岸：上行琶音 + 收尾清脆"叮" */
function sfxWin() {
  const ctx = audioCtx();
  if (!ctx) return;
  const t = ctx.currentTime + 0.02;
  [[523.25, 0], [659.25, 0.15], [783.99, 0.30], [1046.5, 0.45]].forEach(function (n) {
    sfxTone(ctx, n[0], t + n[1], 0.30, 0.24, 'sine');
    sfxTone(ctx, n[0] * 2, t + n[1], 0.16, 0.07, 'triangle');
  });
  sfxTone(ctx, 1567.98, t + 0.70, 0.50, 0.16, 'sine');
  sfxNoise(ctx, t + 0.66, 0.34, 0.05, 4200);
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('on'), 2000);
}
function norm(s) {
  return String(s || '')
    .replace(/[.,!?;:]+$/g, '')
    .replace(/[\u2018\u2019]/g, "'")
    .trim().replace(/\s+/g, ' ').toLowerCase();
}
function same(a, b) { return norm(a) === norm(b); }

function back() { if (V.back) go(V.back); else go('home'); }

}

/* 新建词库：先挑年级 / 平日作业，再起名字 */
function askNewLib(cb) {
  const mask = document.createElement('div');
  mask.className = 'mask';
  let g = '3';
  const chip = (val, txt) => `<button data-lg="${val}" style="padding:9px 13px;border-radius:11px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;border:1.5px solid ${val === g ? '#2FC1BE' : '#DBD2C0'};background:${val === g ? '#E7F8F5' : '#FFFDF7'};color:${val === g ? '#14938F' : '#7C8A96'}">${txt}</button>`;
  mask.innerHTML = `<div class="modal">
    <h3>新建词库</h3><p>先选它属于哪个年级（或平日作业），之后按年级分组就找得到。</p>
    <div id="nbChips" style="display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 4px">
      ${GRADES.map(x => chip(x.k, x.name)).join('')}${chip('home', '平日作业')}
    </div>
    <input class="field" id="nbName" placeholder="例如：七上 Unit 3 单词 / 10月15日作业" autocomplete="off" style="margin-top:12px">
    <div class="acts" style="margin-top:16px">
      <button class="btn btn-ghost" id="nbNo">取消</button>
      <button class="btn btn-green" id="nbYes">创建</button>
    </div>
  </div>`;
  document.body.appendChild(mask);
  const inp = mask.querySelector('#nbName');
  const chips = mask.querySelectorAll('#nbChips [data-lg]');
  const paintChips = () => chips.forEach(c => {
    const on = c.dataset.lg === g;
    c.style.borderColor = on ? '#2FC1BE' : '#DBD2C0';
    c.style.background = on ? '#E7F8F5' : '#FFFDF7';
    c.style.color = on ? '#14938F' : '#7C8A96';
  });
  chips.forEach(c => c.onclick = () => { g = c.dataset.lg; paintChips(); });
  setTimeout(() => inp.focus(), 60);
  const close = () => mask.remove();
  const submit = () => {
    const name = inp.value.trim();
    if (!name) { inp.focus(); return; }
    close(); cb({ name, g });
  };
  mask.querySelector('#nbNo').onclick = close;
  mask.querySelector('#nbYes').onclick = submit;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
}

/* 单词编辑 */
function editWord(lib, idx) {
  const isNew = idx < 0;
  const w = isNew ? { en: '', cn: '', ph: '' } : lib.words[idx];
  const mask = document.createElement('div');
  mask.className = 'mask';
  mask.innerHTML = `<div class="modal">
    <h3>${isNew ? '添加单词' : '编辑单词'}</h3>
    <p>只填英文和中文就够，音标留空会自动标注为“待补”。</p>
    <span class="label" style="margin-top:0">英文</span>
    <input class="field" id="wEn" value="${esc(w.en)}" placeholder="look after" autocapitalize="off">
    <span class="label">中文释义</span>
    <input class="field" id="wCn" value="${esc(w.cn)}" placeholder="照顾；照看">
    <span class="label">音标（可选）</span>
    <input class="field" id="wPh" value="${esc(w.ph || '')}" placeholder="/lʊk ˈɑːftə(r)/">
    <div class="acts" style="margin-top:16px">
      <button class="btn btn-ghost" id="wNo">取消</button>
      <button class="btn btn-green" id="wYes">保存</button>
    </div>
  </div>`;
  document.body.appendChild(mask);
  setTimeout(() => mask.querySelector('#wEn').focus(), 60);
  mask.querySelector('#wNo').onclick = () => mask.remove();
  mask.querySelector('#wYes').onclick = () => {
    const en = mask.querySelector('#wEn').value.trim();
    const cn = mask.querySelector('#wCn').value.trim();
    const ph = mask.querySelector('#wPh').value.trim();
    if (!en || !cn) { toast('英文和中文都要填'); return; }
    if (isNew) lib.words.push({ en, cn, ph }); else { w.en = en; w.cn = cn; w.ph = ph; }
    save(); mask.remove();
    go('libDetail', { libId: lib.id, tab: 'words' }, 'libs');
    toast(isNew ? '已添加' : '已保存');
  };
}

/* 批量导入 */
function bulkImport(lib) {
  const mask = document.createElement('div');
  mask.className = 'mask';
  mask.innerHTML = `<div class="modal">
    <h3>批量粘贴</h3>
    <p>一行一个词，英文和中文用逗号、制表符或空格分开。音标可以留空。</p>
    <textarea class="field" id="bulkTa" placeholder="look after,照顾&#10;welcome,欢迎&#10;grade,年级"></textarea>
    <div class="acts" style="margin-top:16px">
      <button class="btn btn-ghost" id="bNo">取消</button>
      <button class="btn btn-green" id="bYes">导入</button>
    </div>
  </div>`;
  document.body.appendChild(mask);
  mask.querySelector('#bNo').onclick = () => mask.remove();
  mask.querySelector('#bYes').onclick = () => {
    const txt = mask.querySelector('#bulkTa').value;
    let added = 0;
    txt.split(/\r?\n/).forEach(line => {
      const t = line.trim();
      if (!t) return;
      let en, cn, ph = '';
      if (t.includes(',')) { const p = t.split(','); en = p[0]; cn = p[1]; ph = p[2] || ''; }
      else if (t.includes('\t')) { const p = t.split('\t'); en = p[0]; cn = p[1]; ph = p[2] || ''; }
      else {
        const m = t.match(/^([^，、\u4e00-\u9fa5]+)[，、\s]+([\u4e00-\u9fa5].*)$/);
        if (m) { en = m[1]; cn = m[2]; } else { return; }
      }
      en = (en || '').trim(); cn = (cn || '').trim(); ph = (ph || '').trim();
      if (!en || !cn) return;
      lib.words.push({ en, cn, ph }); added++;
    });
    save(); mask.remove();
    go('libDetail', { libId: lib.id, tab: 'words' }, 'libs');
    toast(added ? '已导入 ' + added + ' 个词条' : '没识别到有效行，检查一下格式');
  };
}
/* ================= 选词 → 确认 → 生成桥 ================= */
function buildTask(lib, d) {
  if (!lib.words.length) { toast('这个词库还没有单词'); return; }
  const mode = d.mode || 'order';
  let picked = [];
  const qty = Math.max(1, Math.min(d.qty || Math.min(10, lib.words.length), lib.words.length));

  if (mode === 'order') {
    picked = lib.words.slice(0, qty).map(w => ({ ...w }));
  } else if (mode === 'random') {
    const pool = lib.words.slice();
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    picked = pool.slice(0, qty).map(w => ({ ...w }));
  } else {
    const sel = (d.sel || []).slice();
    if (!sel.length) { toast('先勾选要练的词'); return; }
    picked = sel.map(i => lib.words[i]).filter(Boolean).map(w => ({ ...w }));
  }

  if (!picked.length) { toast('没有选出单词'); return; }
  confirmWords(lib, picked);
}

function confirmWords(lib, words) {
  const chosen = words.map(() => true);
  const mask = document.createElement('div');
  mask.className = 'mask';
  const paint = () => {
    mask.innerHTML = `<div class="modal">
      <h3>确认这次要练的词</h3>
      <p>共选 <b id="cnt">${chosen.filter(Boolean).length}</b> 个。点一行可以取消，确认后才会生成桥。</p>
      <div class="selectlist" id="cfList">
        ${words.map((w, i) => `<div class="selectrow ${chosen[i] ? 'on' : ''}" data-ci="${i}">
          <div class="box">${chosen[i] ? '✓' : ''}</div>
          <div style="flex:1;min-width:0"><div class="en">${esc(w.en)}</div><div class="cn">${esc(w.cn)}</div></div>
        </div>`).join('')}
      </div>
      <div class="acts" style="margin-top:16px">
        <button class="btn btn-ghost" id="cfNo">取消</button>
        <button class="btn btn-main" id="cfYes">生成学习桥</button>
      </div>
    </div>`;
    mask.querySelectorAll('[data-ci]').forEach(el => el.onclick = () => {
      const i = +el.dataset.ci;
      chosen[i] = !chosen[i];
      el.classList.toggle('on');
      el.querySelector('.box').textContent = chosen[i] ? '✓' : '';
      mask.querySelector('#cnt').textContent = chosen.filter(Boolean).length;
    });
    mask.querySelector('#cfNo').onclick = () => mask.remove();
    mask.querySelector('#cfYes').onclick = () => {
      const finalWords = words.filter((w, i) => chosen[i]);
      if (!finalWords.length) { toast('至少要留一个词'); return; }
      mask.remove();
      const md = new Date();
      S.bridges.unshift({
        id: uid(),
        name: lib.name + ' · ' + (md.getMonth() + 1) + '月' + md.getDate() + '日',
        libId: lib.id,
        words: finalWords,
        created: Date.now(),
        done: false
      });
      save();
      go('bridges', {}, 'parent');
      toast('已生成 1 座桥，共 ' + finalWords.length + ' 个词');
    };
  };
  paint();
  document.body.appendChild(mask);
}

/* ================= 自动抽词 · 今日任务 ================= */
function ensureTodayTask() {
  let made = false;
  Object.keys(S.auto).forEach(libId => {
    const cfg = S.auto[libId];
    const lib = S.libs.find(l => l.id === libId);
    if (!cfg || !cfg.on || !lib || !lib.words.length) return;
    if (cfg.lastRun === DAY()) return;
    const cursor = cfg.cursor || 0;
    const fresh = lib.words.slice(cursor, cursor + cfg.newCount).map(w => ({ ...w }));
    cfg.cursor = cursor + fresh.length;
    const review = S.weak.slice(0, cfg.reviewCount || 0).map(w => ({ en: w.en, cn: w.cn, ph: w.ph }));
    const all = fresh.concat(review);
    if (!all.length) {
      cfg.lastRun = DAY(); save(); return;
    }
    const md = new Date();
    S.bridges.unshift({
      id: uid(), name: '今日任务 · ' + (md.getMonth() + 1) + '月' + md.getDate() + '日',
      libId: libId, words: all, created: Date.now(), done: false, auto: true
    });
    cfg.lastRun = DAY();
    made = true;
  });
  if (made) save();
}

/* 按单元直接开一座桥：同一个单元词库有未完成的桥就复用，避免列表里越堆越多 */
function makeUnitBridge(libId) {
  const lib = S.libs.find(l => l.id === libId) || S.libs.find(l => l.unit === libId);
  if (!lib || !lib.words.length) { toast('这个单元还没有单词'); return null; }
  const shortBook = lib.book && !/^外研/.test(lib.book) ? '精通三上 ' : '';
  const label = shortBook + (lib.unit || lib.name);
  let b = S.bridges.find(x => x.libId === lib.id && !x.done);
  if (b) {
    b.words = lib.words.map(w => ({ ...w }));
    b.name = label + ' 单元练习';
    b.unit = lib.unit;
  } else {
    b = {
      id: uid(), name: label + ' 单元练习', libId: lib.id, unit: lib.unit,
      words: lib.words.map(w => ({ ...w })), created: Date.now(), done: false
    };
    S.bridges.unshift(b);
  }
  save();
  return b;
}

function parseBulk(txt) {
  const out = [];
  String(txt || '').split(/\r?\n/).forEach(line => {
    const t = line.trim();
    if (!t) return;
    let en = '', cn = '', ph = '';
    if (t.includes(',')) { const p = t.split(','); en = p[0]; cn = p[1]; ph = p[2] || ''; }
    else if (t.includes('\t')) { const p = t.split('\t'); en = p[0]; cn = p[1]; ph = p[2] || ''; }
    else {
      const m = t.match(/^([^，、\u4e00-\u9fa5]+)[，、\s]+([\u4e00-\u9fa5].*)$/);
      if (m) { en = m[1]; cn = m[2]; } else return;
    }
    en = en.trim(); cn = cn.trim(); ph = (ph || '').trim();
    if (en && cn) out.push({ en, cn, ph });
  });
  return out;
}

/* 头像裁切：方形取景框 + 拖动 + 双指/滑块缩放，默认取画面上部（脸的位置） */
function openAvatarCrop(file, done) {
  const S0 = Math.max(210, Math.min(window.innerWidth - 56, window.innerHeight - 260, 320));
  const mask = document.createElement('div');
  mask.id = 'cropMask';
  mask.innerHTML = `
    <div style="color:#CFE9E4;font-size:13.5px;font-weight:800;margin-bottom:12px;letter-spacing:.5px">调整头像 · 让脸在框里</div>
    <div id="cropStage" style="width:${S0}px;height:${S0}px">
      <img id="cropImg" alt="">
      <div id="cropGrid"></div>
    </div>
    <div style="width:${S0}px;display:flex;align-items:center;gap:10px;margin-top:14px">
      <span style="color:#8FB8B3;font-size:12px">缩小</span>
      <input id="cropZoom" type="range" min="0" max="100" value="0" style="flex:1;accent-color:#2FC1BE">
      <span style="color:#8FB8B3;font-size:12px">放大</span>
    </div>
    <div style="color:#7FA9A4;font-size:11.5px;line-height:1.65;margin-top:8px;text-align:center;max-width:${S0}px">按住图片拖到合适位置，双指捏合或用滑块缩放。<br>头占满框、露出到下巴就最好看。</div>
    <div style="display:flex;gap:10px;width:${S0}px;margin-top:16px">
      <button id="cropCancel" style="flex:1;padding:13px;border-radius:12px;border:1.5px solid #3C6A68;background:transparent;color:#BFE7E2;font-family:inherit;font-weight:700;font-size:15px">取消</button>
      <button id="cropOk" style="flex:1;padding:13px;border-radius:12px;border:none;background:linear-gradient(180deg,#43D6B6,#22B98B);color:#fff;font-family:inherit;font-weight:800;font-size:15px;box-shadow:0 4px 0 #199B74">就用这张</button>
    </div>`;
  document.body.appendChild(mask);

  const im = mask.querySelector('#cropImg');
  const stageEl = mask.querySelector('#cropStage');
  const slider = mask.querySelector('#cropZoom');
  const url = URL.createObjectURL(file);
  let base = 1, k = 1, tx = 0, ty = 0, iw = 1, ih = 1, alive = true;

  function applyClamp() {
    const W = iw * base * k, H = ih * base * k;
    const mx = Math.max(0, (W - S0) / 2), my = Math.max(0, (H - S0) / 2);
    tx = Math.min(mx, Math.max(-mx, tx));
    ty = Math.min(my, Math.max(-my, ty));
  }
  function paint() {
    applyClamp();
    im.style.width = (iw * base * k) + 'px';
    im.style.height = (ih * base * k) + 'px';
    im.style.transform = 'translate(-50%,-50%) translate(' + tx + 'px,' + ty + 'px)';
  }
  function syncSlider() {
    slider.value = String(Math.round(((k - 1) / 3) * 100));
  }

  im.onload = () => {
    iw = im.naturalWidth || 1; ih = im.naturalHeight || 1;
    base = S0 / Math.min(iw, ih);
    k = 1.4;                          /* 默认多放大一点，让脸占满画面 */
    tx = 0;
    ty = (0.5 - 0.28) * ih * base * k; /* 默认对准画面上部 28%，通常正好是脸 */
    syncSlider();
    paint();
  };
  im.src = url;

  slider.oninput = () => { k = 1 + (Number(slider.value) / 100) * 3; paint(); };

  const ptrs = new Map();
  let d0 = 0, k0 = 1, mid0 = null;
  const two = () => Array.from(ptrs.values());
  const distOf = () => { const p = two(); return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); };
  const midOf = () => { const p = two(); return { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 }; };

  stageEl.addEventListener('pointerdown', e => {
    try { stageEl.setPointerCapture(e.pointerId); } catch (x) {}
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2) { d0 = distOf(); k0 = k; mid0 = midOf(); }
  });
  stageEl.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    const prev = ptrs.get(e.pointerId);
    const cur = { x: e.clientX, y: e.clientY };
    ptrs.set(e.pointerId, cur);
    if (ptrs.size === 1) {
      tx += cur.x - prev.x; ty += cur.y - prev.y; paint();
    } else if (ptrs.size === 2) {
      if (d0 > 0) k = Math.min(4, Math.max(1, k0 * (distOf() / d0)));
      const mid = midOf();
      if (mid0) { tx += mid.x - mid0.x; ty += mid.y - mid0.y; mid0 = mid; }
      syncSlider(); paint();
    }
  });
  const up = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) { d0 = 0; mid0 = null; } };
  stageEl.addEventListener('pointerup', up);
  stageEl.addEventListener('pointercancel', up);
  stageEl.addEventListener('wheel', e => {
    e.preventDefault();
    k = Math.min(4, Math.max(1, k + (e.deltaY < 0 ? 0.12 : -0.12)));
    syncSlider(); paint();
  }, { passive: false });

  function cleanup() {
    alive = false;
    try { URL.revokeObjectURL(url); } catch (x) {}
    mask.remove();
  }
  mask.querySelector('#cropCancel').onclick = () => { cleanup(); done(null); };
  mask.querySelector('#cropOk').onclick = () => {
    try {
      const scale = base * k;
      const left = (S0 - iw * scale) / 2 + tx;
      const top = (S0 - ih * scale) / 2 + ty;
      let sx = -left / scale, sy = -top / scale, sw = S0 / scale, sh = S0 / scale;
      sx = Math.max(0, Math.min(iw - 1, sx));
      sy = Math.max(0, Math.min(ih - 1, sy));
      sw = Math.min(iw - sx, sw); sh = Math.min(ih - sy, sh);
      const out = 200;
      const c = document.createElement('canvas');
      c.width = out; c.height = out;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#EFE9DA'; ctx.fillRect(0, 0, out, out);
      ctx.drawImage(im, sx, sy, sw, sh, 0, 0, out, out);
      const dataURL = c.toDataURL('image/jpeg', 0.8);
      cleanup(); done(dataURL);
    } catch (err) { toast('这张图处理不了，换一张试试'); cleanup(); done(null); }
  };
}

function compressImage(file, cb) {
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = () => {
    const size = 160;
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const ctx = c.getContext('2d');
    const s = Math.min(img.width, img.height);
    ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
    URL.revokeObjectURL(url);
    try { cb(c.toDataURL('image/jpeg', 0.72)); } catch (e) { cb(null); }
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('这张图读不出来，换一张试试'); };
  img.src = url;
}

const SCENE_W_BASE = 440, KID_HALF = 58;
const START_CX = 62, PLANK0_CX = 96, PLANK_END_CX = 352, PLANK_STEP = 26, SHORE_CX = 388;
/* 步距按词数均分整段桥面：第 1 步到最后一步落在 PLANK0_CX..PLANK_END_CX 之间 */
function plankCx(i) {
  var n = 10;
  try { if (G && G.words && G.words.length) n = G.words.length; } catch (e) {}
  if (n < 1) n = 1;
  /* 起点到对岸整段均分：第 i 个词走完后的位置 = 起点 + 全程 × i/n */
  var f = i / n;
  if (f < 0) f = 0; if (f > 1) f = 1;
  return START_CX + (SHORE_CX - START_CX) * f;
}
function cxPct(cx) { return (cx / SCENE_W_BASE) * 100; }
function placeKid(cx, shore) {
  const rig = document.getElementById('rig');
  if (!rig) return;
  rig.style.left = 'calc(' + cxPct(cx).toFixed(2) + '% - ' + KID_HALF + 'px)';
  rig.style.bottom = shore ? 'calc(43.3% - 33px)' : 'calc(40.3% - 39px)';
  const g = document.getElementById('glow');
  if (g) {
    const pct = cxPct(cx).toFixed(2);
    g.style.left = 'calc(' + pct + '% - 38px)';
    g.style.bottom = shore ? 'calc(43.3% - 39px)' : 'calc(40.3% - 45px)';
    g.classList.add('on');
  }
}
function glowAt(i) {
  const g = document.getElementById('glow');

      if (W.i >= W.words.length) W.done = true;
      go('warmup', d, 'kidList');
      if (W.done) return;
      toast('已跳过这一个');
    };

    inp.oninput = () => {
      const cur = W.words[W.i];
      const nt = norm(cur.en);
      const nv = norm(inp.value);
      if (!nv) { inp.style.borderColor = '#34496B'; hint.textContent = '照着上面写，写对自动进下一个'; hint.style.color = '#6E86A4'; return; }
      if (nv === nt && inp.value.trim().length >= cur.en.trim().length) {
        inp.style.borderColor = '#8FD3AE';
        if (W.round === 0) {
          W.round = 1;
          setTimeout(() => { W.speak = false; go('warmup', d, 'kidList'); }, 180);
        } else {
          W.round = 0; W.i++; W.speak = true;
          if (W.i >= W.words.length) W.done = true;
          setTimeout(() => { go('warmup', d, 'kidList'); }, 220);
        }
        return;
      }
      if (nt.startsWith(nv)) {
        inp.style.borderColor = '#F7C948';
        hint.textContent = '继续写…';
        hint.style.color = '#F7C948';
      } else {
        inp.style.borderColor = '#C4483E';
        hint.textContent = '这里拼错了，删掉重写';
        hint.style.color = '#FF9A8A';
        if (rig) { rig.classList.add('fall'); setTimeout(() => rig.classList.remove('fall'), 500); }
      }
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') e.preventDefault(); });
  }
};

function practiceLibs() {

function practiceStart(mode, libId) {
  const libs = practiceLibs();
  if (!libs.length) return null;
  const prevDir = (P && P.mode === 'quiz' && P.dir) || 'en';
  const lib = libs.find(l => l.id === libId) || libs[0];
  const words = lib.words.slice();
  for (let i = words.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = words[i]; words[i] = words[j]; words[j] = t;

  P = { mode, libId: lib.id, libName: lib.name, words, i: 0, revealed: false, right: 0, wrong: 0, picks: null, dir: (prevDir || 'en') };
  return P;
}
/* 选词库页面：按 年级 → 单元 / 平日作业 分组，返回 grid 内的卡片串 */
function pickGroupsHTML(libs) {
  const card = l => `<button data-picklib="${l.id}" style="text-align:left;padding:12px 13px;border-radius:12px;border:1.5px solid #DBEFEA;background:#FFFFFF;color:#1F4B5E;font-family:inherit;cursor:pointer">

}
function libLabel(l) {
  const isJt = /^精通/.test(String(l.name || '')) || /^精通/.test(String(l.book || ''));
  return l.unit
    ? (isJt ? '精通三上 ' + String(l.unit).replace('Unit ', 'U') : String(l.unit))

}

  }).join('');

/* 选择题备选：从一个词库里抽，正确答案 1 个 + 干扰项 4 个，共 5 个
   dir='en' 看中文选英文；dir='cn' 看英文选中文释义 */
function pickOptions(cur, dir) {
  const cn = dir === 'cn';
  const key = cn ? 'cn' : 'en';
  const right = String((cn ? cur.cn : cur.en) || '');
  const opts = [right];
  const pool = S.libs.reduce((a, l) => a.concat(l.words || []), []);
  const cands = pool.map(w => String(w[key] || '')).filter(v => v && norm(v) !== norm(right));
  let guard = 0;
  while (opts.length < 5 && cands.length && guard < 800) {
    guard++;
    const k = Math.floor(Math.random() * cands.length);
    const v = cands.splice(k, 1)[0];
    if (!opts.some(o => norm(o) === norm(v))) opts.push(v);
  }
  const shuffled = opts.slice();
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = t;
  }
  return { dir: cn ? 'cn' : 'en', right: right, opts: shuffled, chosen: null };
}
const SPK_SVG = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 8a5 5 0 010 8"/></svg>`;

function bindPracticeDone() {
  const a = document.getElementById('pAgain');
  const b = document.getElementById('pBack');
  if (a) a.onclick = () => { practiceStart(P.mode, P.libId); render(); };
  if (b) b.onclick = () => go('kidList', {}, 'home');
  document.querySelectorAll('[data-nextlib]').forEach(el => el.onclick = () => {
    practiceStart(P.mode, el.dataset.nextlib);
    render();
  });
  /* 撒花：只在本次完成页出现一次 */
  const wrap = document.querySelector('.donewrap');
  const acc = P.words.length ? Math.round(P.right / P.words.length * 100) : 0;
  if (wrap) {
    const colors = acc >= 85
      ? ['#F7C948', '#F2784B', '#8FD3AE', '#FFF3DA', '#FFD08A']
      : ['#8FA6C1', '#9BD08F', '#F7C948'];
    const n = acc >= 100 ? 26 : acc >= 85 ? 18 : 12;
    for (let i = 0; i < n; i++) {
      const c = document.createElement('div');
      c.className = 'doneconfetti';
      c.style.left = (4 + Math.random() * 92).toFixed(1) + '%';

      c.style.animationDuration = (1.8 + Math.random() * 1.1).toFixed(2) + 's';
      wrap.appendChild(c);
      setTimeout(function () { if (c.parentNode) c.parentNode.removeChild(c); }, 3400);
    }
  }
}
