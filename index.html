  html(d) {
    let words, title;
    if (d.weak) { words = S.weak.map(w => ({ ...w })); title = '薄弱词修补桥'; }
    else {
      const b = S.bridges.find(x => x.id === d.bridgeId);
      if (!b) return `<div class="screen kidbg">${topbar('闯关', 'kidList')}<div class="empty" style="color:#7B90AB">找不到这座桥</div></div>`;
      words = b.words.slice(); title = b.name;
    }
    if (!G || G.key !== (d.weak ? 'weak' : d.bridgeId) || G.finished) {
      const shuffled = words.slice();
      for (let i = shuffled.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; }
      G = { key: d.weak ? 'weak' : d.bridgeId, weakMode: !!d.weak, bridgeId: d.bridgeId, words: shuffled, i: 0, tries: 0, firstTry: 0, newWeak: 0, locked: false, finished: false };
    }
    if (!G.words.length) {
      return `<div class="screen kidbg">${topbar('闯关', 'kidList')}<div class="empty" style="color:#7B90AB">这里没有词</div></div>`;
    }
    const center = document.getElementById('view').clientWidth ? document.getElementById('view').clientWidth * 0.42 : 170;
    const cur = G.words[G.i];
    return `<div class="screen kidbg">
      <div class="topbar" style="color:#fff;padding-bottom:4px">
        <button class="back" data-back="1" aria-label="返回">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <h2 style="font-size:14px;color:#9FB4CC;font-weight:600">${esc(title)}</h2>
        <div class="right"><span style="font-size:13px;color:#F7C948;font-weight:800" id="progText">${G.i + 1}/${G.words.length}</span></div>
      </div>
      <div class="progwrap"><i id="progBar"></i></div>
      ${sceneHTML(G.words.length, center)}
      <div class="qcard">
        <div class="qline">
          <div style="flex:1;min-width:0">
            <div class="qcn" id="qcn">${esc(cur.cn)}</div>
            <div class="qph" id="qph">${esc(cur.ph || '音标待补')}</div>
          </div>
          <button class="speaker" id="spk" aria-label="听一遍">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 8a5 5 0 010 8"/>
            </svg>
          </button>
        </div>
        <div class="qmeta" id="qmeta">写出对应的英文 · 第 ${G.i + 1} 块板</div>
        <div id="hintLine" style="font-size:13px;color:#FF9A8A;margin-top:8px;height:18px;line-height:18px"></div>
        <div id="revealBox">
          <div class="rb-t">先照着写一遍，写对了才走下一块板</div>
          <div class="rb-w" id="revealWord"></div>
        </div>
        <div style="flex:1"></div>
      </div>
      <div class="answerbar">
        <input id="ans" placeholder="拼写英文…" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off">
        <button id="submit">提交</button>
      </div>
    </div>`;
  },
  bind(d) {
    if (!G || !G.words.length) { go('kidList', {}, 'home'); return; }
    if (G.finished) { renderResult(); return; }
    const center = document.getElementById('view').clientWidth ? document.getElementById('view').clientWidth * 0.42 : 170;
    const track = document.getElementById('track');
    const rig = document.getElementById('rig');
    const inp = document.getElementById('ans');
    const hint = document.getElementById('hintLine');
    const fx = document.getElementById('waterfx');
    const spk = document.getElementById('spk');

    requestAnimationFrame(() => { if (track) track.style.transition = 'transform .55s cubic-bezier(.3,.9,.25,1)'; });
    setProg();
    setTimeout(() => inp.focus(), 60);
    speak(G.words[G.i].en);

    spk.onclick = () => {
      speak(G.words[G.i].en);
      spk.classList.add('playing');
      setTimeout(() => spk.classList.remove('playing'), 640);
    };

    const revealBox = document.getElementById('revealBox');
    const revealWord = document.getElementById('revealWord');
    const hideReveal = () => { if (revealBox) revealBox.classList.remove('on'); };

    const submit = () => {
      if (G.locked) return;
      const v = inp.value;
      if (!v.trim()) { toast('先拼一下'); return; }
      const cur = G.words[G.i];
      if (same(v, cur.en)) {
        /* 正确 */
        G.locked = true;
        if (G.tries === 0) G.firstTry++;
        if (rig) { rig.classList.remove('idle', 'fall', 'cheer'); rig.classList.add('jump', 'walking'); }
        hint.textContent = '';
        hideReveal();
        if (G.i >= G.words.length - 1) {
          /* 最后一块板：上岸庆祝 */
          crossToShore(rig, center);
          return;
        }
        stepKid(G.i + 1);
        setTimeout(() => {
          if (rig) rig.classList.remove('jump', 'walking');
          if (rig) rig.classList.add('idle');
          G.i++; G.tries = 0; G.locked = false; G.revealed = false;
          if (G.i >= G.words.length) { finishGame(); return; }
          updateQuestion();
        }, 680);
      } else {
        /* 错误 */
        const b = document.querySelector(`.board[data-b="${G.i}"]`);
        if (b) { b.classList.add('shake'); setTimeout(() => b.classList.remove('shake'), 420); }
        if (rig) { rig.classList.remove('idle'); rig.classList.add('fall'); }
        if (fx) { fx.classList.remove('on'); void fx.offsetWidth; fx.classList.add('on'); }
        sfxMiss(false);
        const cur2 = G.words[G.i];
        if (G.revealed) {
          hint.textContent = '照着上面的写法抄一遍，抄对才前进';
          setTimeout(() => {
            if (rig) rig.classList.remove('fall');
            if (rig) rig.classList.add('idle');
            inp.value = '';
            inp.focus();
          }, 620);
          return;
        }
        G.tries++;
        if (G.tries === 1) {
          hint.textContent = '差一点。首字母是 “' + cur2.en.trim()[0] + '”，改一改再提交';
          setTimeout(() => {
            if (rig) rig.classList.remove('fall');
            if (rig) rig.classList.add('idle');
            if (b) b.classList.remove('shake');
            inp.value = '';
            inp.focus();
          }, 620);
        } else {
          G.revealed = true;
          G.tries = 0;
          G.newWeak++;
          addWeak(cur2);
          if (b) { b.classList.remove('shake'); b.classList.add('gap'); }
          hint.textContent = '';
          G.locked = true;
          sfxMiss(true);
          playDrown(rig, function () {
            G.locked = false;
            if (revealWord) revealWord.textContent = cur2.en;
            if (revealBox) revealBox.classList.add('on');
            if (rig) { rig.classList.remove('fall'); rig.classList.add('idle'); }
            if (typeof plankCx === 'function') placeKid(plankCx(G.i));
            if (inp) { inp.value = ''; inp.focus(); }
            setProg();
          });
        }
      }
    };

    document.getElementById('submit').onclick = submit;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
  }
};

function setProg() {
  const bar = document.getElementById('progBar');
  if (!bar || !G || !G.words.length) return;
  const pct = Math.max(4, Math.min(100, Math.round((G.i / G.words.length) * 100)));
  bar.style.width = pct + '%';
}


function refreshBoards() {
  const sc = document.getElementById('scene');
  if (!sc) return;
  const r = sc.getBoundingClientRect();
  document.querySelectorAll('.board').forEach(b => {
    const q = b.getBoundingClientRect();
    if (q.right - r.left < 178) b.classList.add('gone');
  });
}
function updateQuestion() {
  const cur = G.words[G.i];
  setProg();
  const qcn = document.getElementById('qcn');
  const qph = document.getElementById('qph');
  const qmeta = document.getElementById('qmeta');
  const prog = document.getElementById('progText');
  const hint = document.getElementById('hintLine');
  const inp = document.getElementById('ans');
  const spk = document.getElementById('spk');
  if (qcn) qcn.textContent = cur.cn;
  if (qph) qph.textContent = cur.ph || '音标待补';
  if (qmeta) qmeta.textContent = '写出对应的英文 · 第 ' + (G.i + 1) + ' 块板';
  if (prog) prog.textContent = (G.i + 1) + '/' + G.words.length;
  if (hint) hint.textContent = '';
  { const rb = document.getElementById('revealBox'); if (rb) rb.classList.remove('on'); }
  G.revealed = false;
  if (inp) { inp.value = ''; inp.focus(); }
  if (spk) {
    spk.onclick = () => {
      speak(G.words[G.i].en);
      spk.classList.add('playing');
      setTimeout(() => spk.classList.remove('playing'), 640);
    };
  }
  speak(cur.en);
}

function addWeak(w) {
  const ex = S.weak.find(x => x.en === w.en);
  if (ex) { ex.wrong++; ex.streak = 0; }
  else S.weak.push({ en: w.en, cn: w.cn, ph: w.ph || '', wrong: 1, streak: 0 });
  save();
}

/* 最后一块板走完：跳上右岸 → 站稳欢呼 → 才放庆祝音 */

/* 掉水演出：跌水 → 露头呼救 → 垂绳 → 攀爬 → 翻上木板 */
function playDrown(rig, done) {
  const scene = document.getElementById('scene');
  const rope = document.getElementById('rope');
  const sos = document.getElementById('sos');
  const ring = document.getElementById('dring');
  const fx = document.getElementById('waterfx');
  if (!rig || !scene) { if (done) done(); return; }
  const rx = parseFloat(rig.style.left || '0') || 0;
  const put = el => { if (el) el.style.left = (rx + 58) + 'px'; };
  put(rope); put(sos); put(ring);
  if (rope) { rope.classList.remove('on', 'sway'); rope.style.height = '0px'; }
  if (sos) { sos.classList.remove('on'); sos.style.bottom = '202px'; }
  if (ring) { ring.classList.remove('on'); ring.style.bottom = '110px'; }
  if (fx) fx.classList.remove('on');
  { const g0 = document.getElementById('glow'); if (g0) g0.classList.remove('on', 'hot'); }

  rig.classList.remove('idle', 'walking', 'jump', 'fall', 'cheer', 'climb');
  rig.classList.add('dfall');
  setTimeout(() => {
    if (ring) { void ring.offsetWidth; ring.classList.add('on'); }
    if (fx) { void fx.offsetWidth; fx.classList.add('on'); }
  }, 240);
  setTimeout(() => { rig.classList.remove('dfall'); rig.classList.add('dwater'); }, 330);
  setTimeout(() => { if (sos) sos.classList.add('on'); }, 560);
  setTimeout(() => { if (rope) rope.classList.add('on'); }, 1520);
  setTimeout(() => { if (rope) rope.classList.add('sway'); }, 1960);
  setTimeout(() => {
    if (sos) sos.classList.remove('on');
    if (rope) rope.classList.remove('sway');
    rig.classList.remove('dwater');
    rig.classList.add('dclimb');
  }, 2060);
  setTimeout(() => {
    if (rope) { rope.classList.remove('on'); rope.style.height = '0px'; }
    rig.classList.remove('dclimb');
    rig.classList.add('dshake');
  }, 3150);
  setTimeout(() => {
    rig.classList.remove('dshake');
    rig.classList.add('idle');
    if (done) done();
  }, 3640);
}

function crossToShore(rig, center) {
  G.i = G.words.length;
  setProg();
  G.locked = true;
  const stillHere = () => !!document.getElementById('scene') && !G.finished;
  setTimeout(function () {
    if (!stillHere()) return;
    if (rig) rig.classList.remove('jump', 'walking');
    /* 跃上右岸：向右挪到岸上，脚下抬高 14px 到岸面 */
    if (rig) {
      placeKid(SHORE_CX, true);
      rig.classList.add('climb');
    }
    setTimeout(function () {
      if (!stillHere()) return;
      if (rig) { rig.classList.remove('climb'); rig.classList.add('cheer'); }
      burstSparks(document.getElementById('scene'), rig);
      const shout = document.getElementById('shout');
      if (shout) {
        const who = (S.profile && S.profile.name) || '小探险家';
        const sp = shout.querySelector('span');
        if (sp) sp.textContent = who + ' 到对岸啦！';
        /* 欢呼字跟着角色走，按实际宽度居中，别压住脑袋 */
        shout.style.right = 'auto';
        shout.style.width = 'max-content';
        shout.classList.remove('on');
        const w = shout.offsetWidth || 180;
        const sceneW = (shout.parentElement && shout.parentElement.clientWidth) || 440;
        let l = (rig ? rig.offsetLeft + KID_HALF : SHORE_CX) - w / 2;
        l = Math.max(6, Math.min(l, sceneW - w - 6));
        shout.style.left = l + 'px';
        void shout.offsetWidth; shout.classList.add('on');
      }
      // 站稳之后再出声
      setTimeout(function () { if (stillHere()) sfxWin(); }, 360);
      setTimeout(function () { if (stillHere()) finishGame(); }, 1800);
    }, 940);
  }, 430);
}

/* 上岸彩带：从角色胸口炸开 */
function burstSparks(host, rig) {
  if (!host) return;
  const W = host.clientWidth || 360;
  const cx = rig ? rig.offsetLeft + 45 : W * 0.7;
  const cy = rig ? (host.clientHeight || 330) - (parseInt(rig.style.bottom, 10) || BANK_TOP) - 78 : (host.clientHeight || 330) * 0.45;
  const colors = ['#F7C948', '#F2784B', '#8FD3AE', '#FFF3DA', '#9BD08F', '#FFD08A'];
  for (let i = 0; i < 20; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.background = colors[i % colors.length];
    s.style.left = (cx + (Math.random() * 40 - 20)).toFixed(0) + 'px';
    s.style.top = (cy + (Math.random() * 24 - 12)).toFixed(0) + 'px';
    s.style.setProperty('--dx', (Math.random() * 170 - 85).toFixed(0) + 'px');
    s.style.setProperty('--dy', (-55 - Math.random() * 95).toFixed(0) + 'px');
    s.style.setProperty('--rot', (Math.random() * 400 - 200).toFixed(0) + 'deg');
    s.style.animationDelay = (Math.random() * 0.28).toFixed(2) + 's';
    host.appendChild(s);
    setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 1700);
  }
}

function finishGame() {
  G.finished = true;
  const total = G.words.length;
  const name = G.weakMode ? '薄弱词修补桥' : (S.bridges.find(b => b.id === G.bridgeId) || {}).name || '学习桥';
  if (!G.weakMode) {
    const b = S.bridges.find(x => x.id === G.bridgeId);
    if (b) { b.done = true; b.doneAt = Date.now(); }
  } else {
    /* 复习全对且已掌握两次的，移出薄弱本 */
    G.words.forEach(w => {
      const ex = S.weak.find(x => x.en === w.en);
      if (ex) { ex.streak = (ex.streak || 0) + 1; if (ex.streak >= 2) S.weak = S.weak.filter(x => x.en !== w.en); }
    });
  }
  S.sessions.push({ date: DAY(), bridge: name, total, firstTry: G.firstTry, weak: G.newWeak });
  save();
  renderResult();
}

function renderResult() {
  const total = G.words.length;
  const el = document.getElementById('view');
  el.innerHTML = `<div class="screen kidbg">
    <div class="resultwrap">
      <div class="result-ico">
        <svg viewBox="0 0 96 96" fill="none">
          <circle cx="48" cy="48" r="46" fill="#2FC1BE"/>
          <circle cx="24" cy="25" r="4.6" fill="#F7C948"/>
          <path d="M8 64 C24 40 72 40 88 64" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
          <path d="M26 52.1v5.2M48 48v5.2M70 52.1v5.2" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" opacity=".42"/>
          <path d="M17 84 C30 88 66 88 79 84" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity=".35"/>
          <circle cx="57" cy="19.7" r="5.4" fill="#FFFFFF"/>
          <path d="M57 25.1V37.6" stroke="#FFFFFF" stroke-width="3.3" stroke-linecap="round"/>
          <path d="M57 37.6L60.4 45.8M57 37.6L53.6 46.6" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
          <path d="M57 27.7L60.9 35" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round"/>
          <path d="M57 28.3L43.5 35.8" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round"/>
          <circle cx="39.5" cy="27.6" r="4.2" fill="#FFFFFF"/>
          <path d="M39.5 31.8V40.2" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
          <path d="M39.5 40.2L42.4 46M39.5 40.2L36.4 46.6" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M39.5 34L43.7 36" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="result-h">成功过桥！</div>
      <div class="result-s">${G.weakMode ? '薄弱词又走了一遍' : '对岸到了，今天的词都过了一遍'}</div>
      <div class="resultgrid">
        <div class="b"><div class="n">${total}</div><div class="k">本次单词</div></div>
        <div class="b"><div class="n" style="color:#1F9D8F">${G.firstTry}</div><div class="k">一次写对</div></div>
        <div class="b"><div class="n" style="color:#E0854A">${G.newWeak}</div><div class="k">进了薄弱本</div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${S.weak.length ? `<button class="btn btn-ghost btn-block" id="toWeak">去修补薄弱词（${S.weak.length}）</button>` : ''}
        <button class="btn btn-green btn-block" id="toList" style="padding:15px">回到我的桥</button>
      </div>
    </div>
  </div>`;
  const tw = document.getElementById('toWeak');
  if (tw) tw.onclick = () => go('prepare', { weak: true }, 'kidList');
  document.getElementById('toList').onclick = () => { G = null; go('kidList', {}, 'home'); };
}

/* ================= 启动 ================= */
(function init() {
  const had = load();
  ensureStudents();
  if (!S.activeId) loadStudent('g7');            // 老数据默认落在七年级
  if (!had || S.seedVer !== SEED_VER) seed();
  seedMissingJT();                                // 精通版三上 Unit 2–6 缺则补进素材池
  normalizeLibs();                                // 词库补上「年级 / 平日作业」归类
  refreshVoices();
  if (typeof window.speechSynthesis !== 'undefined') {
    // 音色列表是异步加载的，加载好再刷新一次；只在还没决定引擎时影响选择
    window.speechSynthesis.onvoiceschanged = () => { refreshVoices(); };
  }
  render();
})();
</script>

  if (!('serviceWorker' in navigator)) return;
  var ok = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!ok) return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
